[project]
name = "poe-retrieval-experiment"
version = "0.1.0"
description = "POE retrieval pipeline experiment"
authors = []
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    python = "^3.11"
    requests = "^2.32"
    httpx = "^0.27"
    json-repair = "^0.30"
    dotenv = "^0.9.9"
    tqdm = "^4.68.2"
    nltk = "^3.9.4"
    pydantic = "^2.13.4"
    pandas = "^3.0.3"
    statsmodels = "^0.14.6"
    rank-eval = "^0.1.3"
    matplotlib = "^3.11.0"
    seaborn = "^0.13.2"
    scikit-learn = "^1.9.0"
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
rag-pipelines = { workspace = true }

[tool.uv.workspace]
members = ["rag_pipelines"]
